<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Compute Gallery icon: a glowing core with two bodies on a tilted orbit, the same mark the
       gallery draws in its sidebar (gallery/src/logo.cpp). Rendered to the PNG, ICO and ICNS
       files next to it by render.sh. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2231"/>
      <stop offset="1" stop-color="#080A0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36C2E0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#36C2E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.36" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#D8F7FF"/>
      <stop offset="0.38" stop-color="#5FD3EC"/>
      <stop offset="1" stop-color="#0F5A73"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.34" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFD2AE"/>
      <stop offset="0.45" stop-color="#F0883E"/>
      <stop offset="1" stop-color="#8A3E10"/>
    </radialGradient>
    <!-- Orbit: cyan on the left, violet on the right, as in the app. -->
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36C2E0"/>
      <stop offset="1" stop-color="#8B7CF6"/>
    </linearGradient>
    <clipPath id="far-side"><rect x="0" y="0" width="1024" height="512" transform="rotate(-28 512 512)"/></clipPath>
    <clipPath id="near-side"><rect x="0" y="512" width="1024" height="512" transform="rotate(-28 512 512)"/></clipPath>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="210" fill="url(#background)"/>
  <rect x="48" y="48" width="928" height="928" rx="210" fill="none" stroke="#2B3442" stroke-width="12"/>
  <circle cx="512" cy="512" r="370" fill="url(#glow)"/>

  <!-- The orbit passes behind the core (far side, dimmer) and in front of it (near side). -->
  <ellipse cx="512" cy="512" rx="365" ry="138" transform="rotate(-28 512 512)" clip-path="url(#far-side)"
           fill="none" stroke="url(#orbit)" stroke-opacity="0.5" stroke-width="30"/>
  <circle cx="759" cy="303" r="38" fill="#BDEFFA"/>
  <circle cx="512" cy="512" r="168" fill="url(#core)"/>
  <ellipse cx="512" cy="512" rx="365" ry="138" transform="rotate(-28 512 512)" clip-path="url(#near-side)"
           fill="none" stroke="url(#orbit)" stroke-opacity="0.95" stroke-width="30"/>
  <circle cx="231" cy="715" r="74" fill="url(#planet)"/>
</svg>
