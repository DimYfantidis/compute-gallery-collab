# Builds the gallery and demos on Linux, Windows and macOS for every pull request and push
# to main. Pushing a tag such as v0.1.0 also publishes a GitHub Release with the packages.
# The build commands mirror the "Building natively" section of README.md.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_FLAGS: -G Ninja -DCMAKE_BUILD_TYPE=Release -DCG_RELOCATABLE=ON -DCG_NATIVE_ARCH=OFF

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the C and C++ sources against .clang-format
        # The demos and tests follow the repository's .clang-format; the gallery (gallery/) has
        # its own style and is not checked. clang-format 18 comes with the runner image.
        run: |
          command -v clang-format-18 || { sudo apt-get update && sudo apt-get install -y clang-format-18; }
          git ls-files -z 'src/*.c' 'src/*.cpp' 'src/*.h' 'src/*.hpp' 'include/*.h' 'tests/*.c' |
            xargs -0 clang-format-18 --dry-run --Werror

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3-jinja2 libglm-dev libstb-dev \
            ocl-icd-opencl-dev opencl-headers libsdl2-dev libsdl2-image-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols xvfb pocl-opencl-icd

      - name: Build
        run: |
          # shellcheck disable=SC2086 # CMAKE_FLAGS is meant to split into arguments
          cmake -S . -B build $CMAKE_FLAGS
          cmake --build build
          cmake --install build --prefix dist/compute-gallery

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        # The packaged gallery on a virtual display: list, screenshot, and run an OpenCL demo
        # through it on the CPU (PoCL).
        run: |
          dist/compute-gallery/compute-gallery --list
          xvfb-run -a -s "-screen 0 1440x900x24" dist/compute-gallery/compute-gallery --size 1440x900 --screenshot gallery-linux.png
          xvfb-run -a dist/compute-gallery/compute-gallery --launch opencl_benchmark --exit-when-done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-linux
          path: gallery-linux.png

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          cd dist && cmake -E tar czf "../compute-gallery-${VERSION}-linux-x64.tar.gz" compute-gallery

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: compute-gallery-*-linux-x64.tar.gz

  windows:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python-jinja mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-opencl-icd mingw-w64-ucrt-x86_64-opencl-headers
            mingw-w64-ucrt-x86_64-glm git

      - name: Build
        run: |
          # shellcheck disable=SC2086 # CMAKE_FLAGS is meant to split into arguments
          cmake -S . -B build $CMAKE_FLAGS
          cmake --build build
          cmake --install build --prefix dist/compute-gallery

      - name: Bundle DLLs and their licenses
        run: |
          # Copy every MSYS2 DLL an executable needs next to it, plus the license files of
          # the packages those DLLs come from.
          mkdir -p dist/compute-gallery/licenses
          for exe in dist/compute-gallery/*.exe dist/compute-gallery/bodies/*.exe; do
            dir=$(dirname "$exe")
            for dll in $(ldd "$exe" | awk '$3 ~ /^\/ucrt64\/bin\// {print $3}'); do
              cp -u "$dll" "$dir/"
              pkg=$(pacman -Qoq "$dll")
              name=${pkg#mingw-w64-ucrt-x86_64-}
              [ -d "/ucrt64/share/licenses/$name" ] && cp -ru "/ucrt64/share/licenses/$name" dist/compute-gallery/licenses/
            done
          done
          ls dist/compute-gallery dist/compute-gallery/licenses

      - name: Test
        # The runner has no OpenCL device, so the OpenCL benchmark is left to the Linux job (PoCL).
        run: ctest --test-dir build --output-on-failure -LE opencl

      - name: Smoke test
        run: dist/compute-gallery/compute-gallery.exe --list

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          cd dist && cmake -E tar cf "../compute-gallery-${VERSION}-windows-x64.zip" --format=zip compute-gallery

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: compute-gallery-*-windows-x64.zip

  macos:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # Jinja2 (for GLAD) goes in a virtual environment: Homebrew's Python refuses global installs.
        run: |
          brew install ninja
          python3 -m venv .venv && .venv/bin/pip install jinja2

      - name: Build
        # Apple's OpenCL stops at 1.2 and lacks the 2.0 API the OpenCL demos use, so the
        # macOS package has the gallery and the OpenGL demos.
        run: |
          source .venv/bin/activate
          # shellcheck disable=SC2086 # CMAKE_FLAGS is meant to split into arguments
          cmake -S . -B build $CMAKE_FLAGS -DCG_BUILD_OPENCL=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          cmake --build build
          cmake --install build --prefix dist/compute-gallery

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: '"dist/compute-gallery/Compute Gallery.app/Contents/MacOS/Compute Gallery" --list'

      - name: Package
        # Ad-hoc signature for the whole bundle (no Developer ID), zipped with ditto, which
        # keeps the bundle's metadata intact.
        run: |
          codesign --force --deep --sign - "dist/compute-gallery/Compute Gallery.app"
          VERSION="${GITHUB_REF_NAME//\//-}"
          ditto -c -k --keepParent dist/compute-gallery "compute-gallery-${VERSION}-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: compute-gallery-*-macos-arm64.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
